name: Contributor checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contributor-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check context links
        run: node scripts/ci/check-context.mjs
      - name: Test contributor helpers
        run: node --test
